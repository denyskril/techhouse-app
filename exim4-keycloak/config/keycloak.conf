# Keycloak OAuth2 Configuration for Exim4
#
# This file contains the configuration for connecting Exim4 to Keycloak
# for OAuth2/OIDC authentication.
#
# Place this file at: /etc/exim4/keycloak.conf
# Permissions: 600 (readable only by exim user)
# Owner: Debian-exim:Debian-exim

# ==============================================================================
# KEYCLOAK SERVER CONFIGURATION
# ==============================================================================

# Keycloak server URL (without trailing slash)
# Example: https://keycloak.example.com
# Example: https://auth.company.com:8443
KEYCLOAK_URL="https://keycloak.example.com"

# Keycloak realm name
# This is the realm where your client is registered
# Default realm: master
# Production: Use a custom realm for better security
KEYCLOAK_REALM="master"

# ==============================================================================
# OAUTH2 CLIENT CREDENTIALS
# ==============================================================================

# Client ID
# This is the client identifier registered in Keycloak
# Must have "Service Accounts Enabled" in Keycloak client settings
KEYCLOAK_CLIENT_ID="exim4-client"

# Client Secret
# IMPORTANT: Keep this secret secure!
# Rotate regularly in production
# Can be integrated with external secret management (Vault, AWS Secrets Manager)
KEYCLOAK_CLIENT_SECRET="your-client-secret-here"

# OAuth2 Scope
# Space-separated list of scopes to request
# Default: "openid email profile"
# For email sending: "openid email"
KEYCLOAK_SCOPE="openid email profile"

# ==============================================================================
# SMTP CONFIGURATION
# ==============================================================================

# SMTP Username
# This is the email address/username used in the XOAUTH2 authentication
# It should match the service account or user in Keycloak
SMTP_USERNAME="mailserver@example.com"

# ==============================================================================
# CACHE CONFIGURATION
# ==============================================================================

# Cache directory for storing access tokens
# Must be writable by the exim user (Debian-exim)
# Permissions: 700
KEYCLOAK_CACHE_DIR="/var/spool/exim4/keycloak"

# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================

# Log file for OAuth2 authentication events
# Must be writable by the exim user
KEYCLOAK_LOG_FILE="/var/log/exim4/keycloak_auth.log"

# Debug mode (0=disabled, 1=enabled)
# Enable for troubleshooting, disable in production
KEYCLOAK_DEBUG="0"

# ==============================================================================
# ADVANCED CONFIGURATION
# ==============================================================================

# Token expiry buffer (seconds)
# Refresh token this many seconds before actual expiry
# Default: 300 (5 minutes)
# TOKEN_EXPIRY_BUFFER=300

# HTTP timeout for Keycloak requests (seconds)
# Default: 10
# KEYCLOAK_HTTP_TIMEOUT=10

# ==============================================================================
# NOTES
# ==============================================================================

# 1. After modifying this file, ensure proper permissions:
#    sudo chown Debian-exim:Debian-exim /etc/exim4/keycloak.conf
#    sudo chmod 600 /etc/exim4/keycloak.conf

# 2. Test the configuration:
#    sudo -u Debian-exim /usr/local/bin/keycloak_token.sh test

# 3. Restart Exim4:
#    sudo systemctl restart exim4

# 4. Monitor logs:
#    sudo tail -f /var/log/exim4/mainlog
#    sudo tail -f /var/log/exim4/keycloak_auth.log

# 5. For production, consider:
#    - Using a dedicated realm (not 'master')
#    - Rotating client secrets regularly
#    - Integrating with external secret management
#    - Enabling additional security features in Keycloak
#    - Using valid SSL/TLS certificates
#    - Setting up monitoring and alerting
