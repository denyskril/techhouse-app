# Exim4 Configuration with Keycloak OAuth2 Support
#
# This is a complete Exim4 configuration that includes OAuth2/OIDC authentication
# support via Keycloak using the XOAUTH2 SASL mechanism.
#
# Based on Debian's split configuration approach but provided as a monolithic
# file for clarity. Adapt to your distribution's conventions as needed.

######################################################################
#                    MAIN CONFIGURATION SETTINGS                     #
######################################################################

# Primary hostname
primary_hostname = mail.example.com

# Domain list - domains we handle locally
domainlist local_domains = @ : localhost : example.com

# Relay domains - domains we relay for
domainlist relay_to_domains = 

# Hosts allowed to relay through us
hostlist relay_from_hosts = 127.0.0.1 : ::1

# ACL configuration
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

# TLS Configuration
tls_advertise_hosts = *
tls_certificate = /etc/ssl/certs/ssl-cert-snakeoil.pem
tls_privatekey = /etc/ssl/private/ssl-cert-snakeoil.key

# Disable TLS verification for now (enable in production)
tls_verify_hosts = 
tls_try_verify_hosts = 

# Logging
log_selector = +smtp_protocol_error +smtp_syntax_error +tls_certificate_verified +tls_peerdn

# Queue and retry
queue_run_max = 5
deliver_queue_load_max = 10.0
queue_only_load = 8.0

# Message size limits
message_size_limit = 50M

# Never qualify recipient addresses
qualify_recipient = example.com

# User to run as
exim_user = Debian-exim
exim_group = Debian-exim

# Spool directory
spool_directory = /var/spool/exim4

# Trust users
trusted_users = Debian-exim

######################################################################
#                       ACL CONFIGURATION                            #
######################################################################

begin acl

# ACL for RCPT TO
acl_check_rcpt:
  
  # Accept if local interface
  accept hosts = :
  
  # Deny if sender domain is invalid
  deny message = Sender verification failed
       !verify = sender
  
  # Accept if from relay hosts
  accept hosts = +relay_from_hosts
         control = submission/sender_retain
  
  # Accept if authenticated
  accept authenticated = *
         control = submission/sender_retain
  
  # Require authentication for non-local
  require message = relay not permitted
          domains = +local_domains : +relay_to_domains
  
  # Verify recipient
  require verify = recipient
  
  # Accept the message
  accept

# ACL for DATA
acl_check_data:
  
  # Deny if message has malformed headers
  deny message = Message headers fail syntax check
       !verify = header_syntax
  
  # Accept the message
  accept

######################################################################
#                      ROUTERS CONFIGURATION                         #
######################################################################

begin routers

# Router for Keycloak OAuth2 authenticated relay
# This router sends mail via an external smarthost using OAuth2 authentication
keycloak_oauth2_relay:
  driver = manualroute
  domains = ! +local_domains
  transport = keycloak_smtp_transport
  route_list = * smtp.example.com::587 byname
  host_find_failed = defer
  same_domain_copy_routing = yes
  no_more

# Router for local delivery
# Delivers to local user mailboxes
local_user:
  driver = accept
  check_local_user
  local_part_suffix = +*
  local_part_suffix_optional
  transport = local_delivery
  cannot_route_message = Unknown user

# Router for domain literal addresses (user@[192.168.1.1])
domain_literal:
  driver = ipliteral
  transport = remote_smtp

######################################################################
#                    TRANSPORTS CONFIGURATION                        #
######################################################################

begin transports

# Local mailbox delivery
local_delivery:
  driver = appendfile
  file = /var/mail/$local_part
  delivery_date_add
  envelope_to_add
  return_path_add
  group = mail
  mode = 0660

# SMTP transport with Keycloak OAuth2 authentication
keycloak_smtp_transport:
  driver = smtp
  port = 587
  hosts_require_tls = *
  hosts_require_auth = *
  
  # Force authentication
  authenticated_sender = ${if !eq{$sender_address}{} {$sender_address}{$authenticated_id}}

# Standard remote SMTP (fallback)
remote_smtp:
  driver = smtp
  port = 25

######################################################################
#                   AUTHENTICATORS CONFIGURATION                     #
######################################################################

begin authenticators

# Keycloak OAuth2 Authenticator (Client)
# This authenticator is used when Exim4 acts as a client connecting to
# external SMTP servers that require XOAUTH2 authentication
keycloak_oauth2_client:
  driver = plaintext
  public_name = XOAUTH2
  client_send = ${run{/usr/local/bin/keycloak_token.sh}{$value}fail}
  client_condition = ${if or{{eq{$host}{smtp.example.com}}{eq{$host}{smtp.gmail.com}}{eq{$host}{smtp.office365.com}}}}

# Plain text authenticator for server mode (incoming connections)
# Used when other mail servers connect to us
plain_server:
  driver = plaintext
  public_name = PLAIN
  server_condition = ${if saslauthd{{$auth2}{$auth3}}}
  server_set_id = $auth2
  server_prompts = :

# LOGIN authenticator for server mode
login_server:
  driver = plaintext
  public_name = LOGIN
  server_prompts = Username:: : Password::
  server_condition = ${if saslauthd{{$auth1}{$auth2}}}
  server_set_id = $auth1

######################################################################
#                         RETRY CONFIGURATION                        #
######################################################################

begin retry

# Retry rules for different scenarios
*                          *           F,2h,15m; G,16h,1h,1.5; F,4d,6h

######################################################################
#                        REWRITE CONFIGURATION                       #
######################################################################

begin rewrite

# No rewrite rules by default

######################################################################
#                    END OF CONFIGURATION                            #
######################################################################
